let LOCALE = "ko";
let SELECTED = ["KR","US","CN","JP","EU"];

function t() { return I18N[LOCALE]; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

function tokenize(s) {
  const norm = s.toLowerCase().replace(/[\s\-_/().,]+/g," ").trim();
  const parts = norm.split(/\s+/).filter(Boolean);
  const grams = new Set(parts);
  for (const p of parts) {
    if (/[가-힣]/.test(p) && p.length >= 2) {
      for (let len = 2; len <= Math.min(p.length, 5); len++) {
        for (let i = 0; i + len <= p.length; i++) grams.add(p.slice(i, i + len));
      }
    }
  }
  return [...grams];
}

function score(entry, tokens) {
  const hay = [...entry.kw.map(x=>x.toLowerCase()), ...entry.kwKo, entry.title.toLowerCase(), entry.titleKo];
  let s = 0;
  for (const tk of tokens) {
    if (!tk) continue;
    for (const h of hay) {
      if (!h) continue;
      if (h === tk) s += 5;
      else if (h.includes(tk)) s += 2;
      else if (tk.length >= 3 && tk.includes(h)) s += 1;
    }
  }
  return s;
}

function pad(hs6, digits) { return digits <= 6 ? hs6.slice(0, digits) : hs6 + "0".repeat(digits - 6); }

function search(q) {
  const tokens = tokenize(q);
  const ranked = HS_DB.map(e => ({ e, s: score(e, tokens) })).filter(x => x.s > 0)
                      .sort((a,b) => b.s - a.s);
  if (!ranked.length) return null;
  const top = ranked[0].e;
  const conf = Math.min(0.85, 0.35 + ranked[0].s * 0.06);
  const alts = ranked.slice(1, 4).map(r => ({ hs6: r.e.hs6, title: LOCALE==="ko" ? r.e.titleKo : r.e.title, score: r.s }));
  const national = SELECTED.map(cc => {
    const meta = COUNTRIES.find(c => c.code === cc);
    return { country: cc, meta, code: pad(top.hs6, meta.digits) };
  });
  return { top, conf, alts, national };
}

function renderCountries() {
  const el = document.getElementById("countries");
  el.innerHTML = "";
  for (const c of COUNTRIES) {
    const div = document.createElement("div");
    div.className = "chip" + (SELECTED.includes(c.code) ? " active" : "");
    div.innerHTML = `<span>${c.flag}</span><span>${LOCALE==="ko" ? c.nameKo : c.name}</span><span class="digits">${t().digits(c.digits)}</span>`;
    div.onclick = () => {
      SELECTED = SELECTED.includes(c.code) ? SELECTED.filter(x=>x!==c.code) : [...SELECTED, c.code];
      renderCountries();
    };
    el.appendChild(div);
  }
  document.getElementById("cntCnt").textContent = SELECTED.length;
}

function renderExamples() {
  const el = document.getElementById("examples");
  el.innerHTML = "";
  for (const ex of t().ex) {
    const span = document.createElement("span");
    span.className = "ex";
    span.textContent = ex;
    span.onclick = () => { document.getElementById("q").value = ex; };
    el.appendChild(span);
  }
}

function renderText() {
  const T = t();
  document.getElementById("title").textContent = T.title;
  document.getElementById("subtitle").textContent = T.subtitle;
  document.getElementById("q").placeholder = T.placeholder;
  document.getElementById("countriesLabel").innerHTML = `${T.countriesLabel} (<span id="cntCnt">${SELECTED.length}</span>)`;
  document.getElementById("examplesLabel").textContent = T.examplesLabel;
  document.getElementById("selAll").textContent = T.selAll;
  document.getElementById("selNone").textContent = T.selNone;
  document.getElementById("goBtn").textContent = T.go;
  document.getElementById("empty").textContent = T.empty;
  document.getElementById("modeLabel").textContent = T.mode;
  document.getElementById("langBtn").textContent = T.lang;
  document.title = T.title;
}

function renderResult(r) {
  const T = t();
  const el = document.getElementById("result");
  document.getElementById("empty").hidden = true;
  el.hidden = false;

  if (!r) {
    el.innerHTML = `<div class="glass"><p style="margin:0;color:#fbbf24">${T.nomatch}</p></div>`;
    return;
  }

  const conf = Math.round(r.conf * 100);
  const title = LOCALE === "ko" ? r.top.titleKo : r.top.title;
  const heading = r.top.hs6.slice(0,4);

  el.innerHTML = `
    <div class="glass">
      <div class="row" style="gap:12px;align-items:baseline">
        <span class="hs-pill">${r.top.hs6}</span>
        <span style="font-size:16px">${escapeHtml(title)}</span>
      </div>
      <div class="grid4">
        <div class="field"><div class="k">${T.chapter}</div><div class="v">${r.top.chapter}</div></div>
        <div class="field"><div class="k">${T.heading}</div><div class="v">${heading}</div></div>
        <div class="field"><div class="k">${T.subheading}</div><div class="v">${r.top.hs6}</div></div>
        <div class="field"><div class="k">${T.confidence}</div>
          <div class="bar"><i style="width:${conf}%"></i></div>
          <div style="text-align:right;font-size:12px;margin-top:2px">${conf}%</div>
        </div>
      </div>
      <div class="field" style="margin-top:10px"><div class="k">${T.rationale}</div>
        <div style="margin-top:4px;font-size:13px;color:#cbd5e1">${T.rationaleText}</div></div>
      <p class="warn">⚠ ${T.warn}</p>
    </div>

    <div class="glass" style="margin-top:12px">
      <h3 style="margin:0 0 6px;font-size:15px">${T.national}</h3>
      <table>
        <thead><tr><th>${T.country}</th><th>${T.code}</th><th>${T.name}</th></tr></thead>
        <tbody>
          ${r.national.map(n => `
            <tr>
              <td>${n.meta.flag} ${LOCALE==="ko" ? n.meta.nameKo : n.meta.name}<br><span style="font-size:11px;color:#94a3b8">${n.meta.schedule}</span></td>
              <td><span class="code">${n.code}</span></td>
              <td>${escapeHtml(title)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>

    ${r.alts.length ? `
      <div class="glass" style="margin-top:12px">
        <h3 style="margin:0 0 6px;font-size:15px">${T.alternates}</h3>
        ${r.alts.map(a => `
          <div class="alt-li">
            <span class="code">${a.hs6}</span>
            <span>${escapeHtml(a.title)}</span>
            <span style="margin-left:auto;color:#94a3b8;font-size:11px">score ${a.score}</span>
          </div>
        `).join("")}
      </div>
    ` : ""}
  `;
}

document.getElementById("goBtn").onclick = () => {
  const q = document.getElementById("q").value.trim();
  if (!q || SELECTED.length === 0) return;
  renderResult(search(q));
};
document.getElementById("q").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") document.getElementById("goBtn").click();
});
document.getElementById("selAll").onclick = () => { SELECTED = COUNTRIES.map(c=>c.code); renderCountries(); };
document.getElementById("selNone").onclick = () => { SELECTED = []; renderCountries(); };
document.getElementById("langBtn").onclick = () => {
  LOCALE = LOCALE === "ko" ? "en" : "ko";
  document.documentElement.lang = LOCALE;
  renderText(); renderCountries(); renderExamples();
};

renderText();
renderCountries();
renderExamples();
</script>
