<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>HS Code 검색</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #6b7280; --line: #e5e7eb;
    --accent: #111111; --soft: #f5f5f4; --ok:#047857;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f0f; --fg:#f5f5f4; --muted:#9ca3af; --line:#262626;
            --accent:#f5f5f4; --soft:#1a1a1a; --ok:#34d399; }
  }
  html, body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; position: relative; }

  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .lang { position: absolute; top: 28px; right: 20px;
    background: none; border: 1px solid var(--line); color: var(--fg);
    font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; }

  .field { margin-bottom: 20px; }
  .field-label { display: block; font-size: 11px; color: var(--muted);
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }

  textarea, input[type="text"] {
    width: 100%; padding: 12px 14px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; font-size: 15px; font-family: inherit; line-height: 1.5;
  }
  textarea { min-height: 70px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--fg); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-block; padding: 6px 11px; border-radius: 4px; font-size: 13px;
    background: var(--bg); border: 1px solid var(--line); color: var(--muted);
    cursor: pointer; user-select: none; font-family: inherit;
  }
  .chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  .small-link { background: none; border: none; color: var(--muted); font-size: 12px;
    cursor: pointer; padding: 4px 0; font-family: inherit; text-decoration: underline; text-underline-offset: 2px; }

  .ex { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px;
    background: var(--soft); border: 1px solid var(--line); color: var(--fg);
    cursor: pointer; font-family: inherit; }

  .submit {
    width: 100%; margin-top: 4px; padding: 13px; border-radius: 6px; border: 0;
    background: var(--accent); color: var(--bg);
    font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .submit:disabled { opacity: 0.4; cursor: not-allowed; }

  .status { font-size: 12px; color: var(--muted); margin-top: 16px; min-height: 18px; }
  .status .verified { color: var(--ok); font-weight: 600; }

  .result-section { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .result-section h2 { margin: 0 0 14px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }

  .hit { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .hit:last-child { border-bottom: 0; }
  .hit-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--soft); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .badge.v { background: var(--ok); color: var(--bg); }
  .hit-title { font-size: 14px; color: var(--fg); }
  .hit-en { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hit-meta { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .hit-meta b { color: var(--fg); font-weight: 500; }

  .countries-row { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .countries-row span { display: inline-block; margin-right: 14px; }
  .countries-row .c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }

  .empty { color: var(--muted); font-size: 13px; margin-top: 24px; }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <button id="langBtn" class="lang">EN</button>

  <header>
    <h1 id="title">HS Code 검색</h1>
    <p class="sub" id="subtitle">제품명으로 국제 HS 6자리 + 한국 HSK 10자리(검증된 항목) 를 검색합니다.</p>
  </header>

  <div class="field" style="margin-top:24px">
    <label class="field-label" id="qLabel">검색어 (한글·영문·HS 코드)</label>
    <input type="text" id="q" placeholder="라면 / coffee / 8517 / 립스틱" autocomplete="off" />
  </div>

  <div class="field">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;align-items:center">
      <label class="field-label" id="countriesLabel" style="margin:0">국가</label>
      <div style="display:flex;gap:12px">
        <button class="small-link" id="selAll">전체</button>
        <button class="small-link" id="selNone">초기화</button>
      </div>
    </div>
    <div class="chips" id="countries"></div>
  </div>

  <div class="field">
    <label class="field-label" id="examplesLabel">예시</label>
    <div class="chips" id="examples"></div>
  </div>

  <button class="submit" id="goBtn" disabled>로딩 중…</button>

  <div id="status" class="status"></div>
  <div id="result"></div>

  <footer id="foot">국제 HS 2022 (WCO 5,613개) + 한국 HSK 검증 일부. UNI-PASS API 키 추가 시 12,000개 전체 가능. 본 도구는 보조용.</footer>
</div>

<script>
const COUNTRIES = [
  { code:"KR", name:"South Korea",   nameKo:"대한민국",   digits:10, schedule:"HSK" },
  { code:"US", name:"United States", nameKo:"미국",       digits:10, schedule:"HTSUS" },
  { code:"CN", name:"China",         nameKo:"중국",       digits:13, schedule:"CN HS" },
  { code:"JP", name:"Japan",         nameKo:"일본",       digits:9,  schedule:"Japan HS" },
  { code:"EU", name:"European Union",nameKo:"유럽연합",   digits:8,  schedule:"CN Code" },
  { code:"GB", name:"United Kingdom",nameKo:"영국",       digits:10, schedule:"UK Tariff" },
  { code:"VN", name:"Vietnam",       nameKo:"베트남",     digits:8,  schedule:"Vietnam HS" },
  { code:"IN", name:"India",         nameKo:"인도",       digits:8,  schedule:"ITC-HS" },
  { code:"AU", name:"Australia",     nameKo:"호주",       digits:8,  schedule:"AHECC" },
  { code:"CA", name:"Canada",        nameKo:"캐나다",     digits:10, schedule:"CCT" },
  { code:"BR", name:"Brazil",        nameKo:"브라질",     digits:8,  schedule:"NCM" },
  { code:"TH", name:"Thailand",      nameKo:"태국",       digits:11, schedule:"AHTN" },
];

const I18N = {
  ko: {
    title:"HS Code 검색",
    subtitle:"제품명으로 국제 HS 6자리 + 한국 HSK 10자리(검증된 항목) 를 검색합니다.",
    qLabel:"검색어 (한글·영문·HS 코드)",
    placeholder:"라면 / coffee / 8517 / 립스틱",
    countriesLabel:"국가",
    examplesLabel:"예시",
    selAll:"전체", selNone:"초기화",
    go:"검색",
    loading:"데이터 로딩 중…",
    ready:n=>`준비 완료: 국제 ${n.toLocaleString()}개 항목, 한국 검증 ${V_COUNT}개`,
    empty:"제품명·재질·용도 또는 HS 코드 일부(예: 8517) 를 입력하세요.",
    nomatch:"일치하는 항목이 없습니다.",
    matches:n=>`${n.toLocaleString()}건 (상위 30개 표시)`,
    digits:n=>`${n}자리`,
    verified:"UNI-PASS 검증",
    approx:"근사값",
    tariff:"한국 관세",
    countries:"국가별 코드",
    lang:"EN",
    ex:["라면","스마트폰","립스틱","커피","8517","무선이어폰","김치"],
    error:"데이터를 불러오지 못했습니다.",
  },
  en: {
    title:"HS Code Search",
    subtitle:"Search WCO 6-digit codes + Korean HSK 10-digit (where verified).",
    qLabel:"Query (Korean/English/HS code)",
    placeholder:"ramen / coffee / 8517 / lipstick",
    countriesLabel:"Countries",
    examplesLabel:"Examples",
    selAll:"All", selNone:"Clear",
    go:"Search",
    loading:"Loading data…",
    ready:n=>`Ready: ${n.toLocaleString()} international entries, ${V_COUNT} Korean verified`,
    empty:"Enter a product name, attribute, or partial HS code (e.g. 8517).",
    nomatch:"No match.",
    matches:n=>`${n.toLocaleString()} hits (top 30 shown)`,
    digits:n=>`${n} digits`,
    verified:"UNI-PASS verified",
    approx:"approximate",
    tariff:"KR tariff",
    countries:"National codes",
    lang:"한국어",
    ex:["ramen","smartphone","lipstick","coffee","8517","wireless earphones","kimchi"],
    error:"Failed to load data.",
  },
};

let LOCALE = "ko";
let SELECTED = ["KR","US","CN","JP","EU"];
let DATA = null;       // {sec_ko, ch, hd, rows: [[hs6, sec, desc], ...]}
let OVERLAY = null;    // {items: {hs6: {ko, kw, hsk, txrt, v}}}
let V_COUNT = 0;

function t() { return I18N[LOCALE]; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

async function loadData() {
  setStatus(t().loading);
  try {
    const [hs6, ko] = await Promise.all([
      fetch("data/hs6.json").then(r => r.json()),
      fetch("data/ko_overlay.json").then(r => r.json()),
    ]);
    DATA = hs6;
    OVERLAY = ko.items;
    V_COUNT = Object.values(OVERLAY).filter(o => o.v).length;
    document.getElementById("goBtn").disabled = false;
    document.getElementById("goBtn").textContent = t().go;
    setStatus(t().ready(DATA.rows.length));
  } catch (e) {
    setStatus(t().error + " (" + e.message + ")");
  }
}

function setStatus(msg) { document.getElementById("status").innerHTML = msg; }

// 검색: 점수 기반, HS코드 prefix 매칭 우선
function search(q) {
  const raw = q.trim();
  if (!raw) return [];

  // HS 코드 형태 (숫자만, 2~6자리) 인 경우 prefix 매칭
  const hsMatch = raw.match(/^[\d.\-\s]+$/);
  if (hsMatch) {
    const num = raw.replace(/[^\d]/g, "");
    if (num.length >= 2) {
      return DATA.rows
        .filter(r => r[0].startsWith(num))
        .slice(0, 30)
        .map(r => ({ row: r, score: 10 }));
    }
  }

  // 텍스트 검색
  const norm = raw.toLowerCase().replace(/[\s\-_/().,]+/g, " ").trim();
  const tokens = norm.split(/\s+/).filter(Boolean);

  // 한글 부분일치를 위한 n-gram
  const grams = new Set(tokens);
  for (const tk of tokens) {
    if (/[가-힣]/.test(tk) && tk.length >= 2) {
      for (let len = 2; len <= Math.min(tk.length, 5); len++) {
        for (let i = 0; i + len <= tk.length; i++) grams.add(tk.slice(i, i + len));
      }
    }
  }
  const allTokens = [...grams];

  const ranked = [];
  for (const r of DATA.rows) {
    const hs6 = r[0];
    const en = r[2].toLowerCase();
    const ov = OVERLAY[hs6];
    let s = 0;

    if (ov) {
      // 한글 키워드/제목 정확/부분 매칭
      const hayKo = [ov.ko, ...(ov.kw||[])];
      for (const tk of allTokens) {
        for (const h of hayKo) {
          if (!h) continue;
          if (h === tk) s += 10;
          else if (h.includes(tk)) s += 4;
        }
      }
      if (ov.v && s > 0) s += 2; // 검증된 항목 부스팅
    }
    // 영문 description
    for (const tk of allTokens) {
      if (tk.length < 2) continue;
      if (en.includes(tk)) s += 2;
    }
    if (s > 0) ranked.push({ row: r, score: s });
  }
  ranked.sort((a,b) => b.score - a.score);
  return ranked.slice(0, 30);
}

function pad(hs6, digits) { return digits <= 6 ? hs6.slice(0, digits) : hs6 + "0".repeat(digits - 6); }

function renderCountries() {
  const el = document.getElementById("countries");
  el.innerHTML = "";
  for (const c of COUNTRIES) {
    const div = document.createElement("div");
    div.className = "chip" + (SELECTED.includes(c.code) ? " active" : "");
    div.textContent = (LOCALE==="ko" ? c.nameKo : c.name) + " · " + t().digits(c.digits);
    div.onclick = () => {
      SELECTED = SELECTED.includes(c.code) ? SELECTED.filter(x=>x!==c.code) : [...SELECTED, c.code];
      renderCountries();
    };
    el.appendChild(div);
  }
}

function renderExamples() {
  const el = document.getElementById("examples");
  el.innerHTML = "";
  for (const ex of t().ex) {
    const span = document.createElement("span");
    span.className = "ex";
    span.textContent = ex;
    span.onclick = () => { document.getElementById("q").value = ex; doSearch(); };
    el.appendChild(span);
  }
}

function renderText() {
  const T = t();
  document.getElementById("title").textContent = T.title;
  document.getElementById("subtitle").textContent = T.subtitle;
  document.getElementById("qLabel").textContent = T.qLabel;
  document.getElementById("q").placeholder = T.placeholder;
  document.getElementById("countriesLabel").textContent = T.countriesLabel;
  document.getElementById("examplesLabel").textContent = T.examplesLabel;
  document.getElementById("selAll").textContent = T.selAll;
  document.getElementById("selNone").textContent = T.selNone;
  document.getElementById("langBtn").textContent = T.lang;
  document.title = T.title;
  if (DATA) {
    document.getElementById("goBtn").textContent = T.go;
    setStatus(T.ready(DATA.rows.length));
  }
}

function renderResults(hits, q) {
  const T = t();
  const el = document.getElementById("result");
  if (!hits.length) {
    el.innerHTML = `<div class="result-section"><p style="margin:0;color:var(--muted);font-size:14px">${T.nomatch}</p></div>`;
    return;
  }
  el.innerHTML = `
    <div class="result-section">
      <h2>${T.matches(hits.length)}</h2>
      ${hits.map(({row}) => renderHit(row)).join("")}
    </div>
  `;
}

function renderHit(row) {
  const T = t();
  const [hs6, sec, en] = row;
  const ov = OVERLAY[hs6] || {};
  const koTitle = ov.ko || "";
  const heading = hs6.slice(0,4);
  const chap = hs6.slice(0,2);
  const chTitle = (DATA.ch[chap] || "").replace(/^[A-Z]?[a-z]+; /,"");
  const hdTitle = DATA.hd[heading] || "";

  const krCode = ov.hsk ? ov.hsk : pad(hs6, 10);
  const krVerified = !!ov.v;

  const others = SELECTED
    .filter(c => c !== "KR")
    .map(cc => {
      const meta = COUNTRIES.find(c => c.code === cc);
      return `<span><b>${LOCALE==="ko" ? meta.nameKo : meta.name}</b> <span class="c">${pad(hs6, meta.digits)}</span></span>`;
    }).join("");

  const krDisplay = SELECTED.includes("KR") ? `
    <span><b>${LOCALE==="ko" ? "대한민국":"South Korea"}</b>
      <span class="c">${krCode}</span>
      <span class="badge ${krVerified ? "v":""}">${krVerified ? T.verified : T.approx}</span>
      ${ov.txrt ? `<span style="margin-left:6px">${T.tariff} ${ov.txrt}%</span>` : ""}
    </span>` : "";

  return `
    <div class="hit">
      <div class="hit-head">
        <span class="code">${hs6}</span>
        ${koTitle ? `<span class="hit-title">${escapeHtml(koTitle)}</span>` : `<span class="hit-title">${escapeHtml(en)}</span>`}
      </div>
      ${koTitle ? `<div class="hit-en">${escapeHtml(en)}</div>` : ""}
      <div class="hit-meta">
        <span>Ch ${chap}: ${escapeHtml(chTitle)}</span>
        <span>Heading ${heading}</span>
      </div>
      <div class="countries-row">${krDisplay}${others}</div>
    </div>
  `;
}

function doSearch() {
  if (!DATA) return;
  const q = document.getElementById("q").value;
  const hits = search(q);
  renderResults(hits, q);
}

document.getElementById("goBtn").onclick = doSearch;
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});
document.getElementById("selAll").onclick = () => { SELECTED = COUNTRIES.map(c=>c.code); renderCountries(); doSearch(); };
document.getElementById("selNone").onclick = () => { SELECTED = []; renderCountries(); };
document.getElementById("langBtn").onclick = () => {
  LOCALE = LOCALE === "ko" ? "en" : "ko";
  document.documentElement.lang = LOCALE;
  renderText(); renderCountries(); renderExamples(); doSearch();
};

renderText();
renderCountries();
renderExamples();
loadData();
</script>
</body>
</html>
