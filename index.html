<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>HS Code 검색</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b7280;
    --line: #e5e7eb;
    --line-strong: #111111;
    --accent: #111111;
    --soft: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f;
      --fg: #f5f5f4;
      --muted: #9ca3af;
      --line: #262626;
      --line-strong: #f5f5f4;
      --accent: #f5f5f4;
      --soft: #1a1a1a;
    }
  }
  html, body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }

  header { margin-bottom: 28px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .lang {
    position: absolute; top: 24px; right: 20px;
    background: none; border: 1px solid var(--line); color: var(--fg);
    font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: inherit;
  }

  .field { margin-bottom: 20px; }
  .field-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }

  textarea {
    width: 100%; min-height: 80px; resize: vertical; padding: 12px 14px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; font-size: 15px; font-family: inherit; line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--line-strong); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-block; padding: 6px 11px; border-radius: 4px; font-size: 13px;
    background: var(--bg); border: 1px solid var(--line); color: var(--muted);
    cursor: pointer; user-select: none; font-family: inherit;
  }
  .chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .small-link {
    background: none; border: none; color: var(--muted); font-size: 12px;
    cursor: pointer; padding: 4px 0; font-family: inherit; text-decoration: underline;
    text-underline-offset: 2px;
  }

  .ex {
    display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px;
    background: var(--soft); border: 1px solid var(--line); color: var(--fg);
    cursor: pointer; font-family: inherit;
  }

  .submit {
    width: 100%; margin-top: 4px; padding: 13px; border-radius: 6px; border: 0;
    background: var(--accent); color: var(--bg);
    font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .submit:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty { color: var(--muted); font-size: 13px; margin-top: 24px; text-align: left; }

  .result-section { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .result-section h2 { margin: 0 0 14px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }

  .hs-main { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .hs-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 26px; font-weight: 600; letter-spacing: 0.02em; }
  .hs-title { font-size: 15px; color: var(--fg); }

  .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .meta-item .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .meta-item .v { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; margin-top: 2px; }

  .conf-bar { height: 2px; background: var(--line); margin-top: 6px; }
  .conf-bar > i { display: block; height: 100%; background: var(--accent); }

  .rationale { margin-top: 16px; font-size: 14px; color: var(--fg); }
  .warn { margin-top: 12px; font-size: 12px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
  td .country { font-weight: 500; }
  td .schedule { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .alt { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; flex-wrap: wrap; }
  .alt:first-child { border-top: none; }
  .alt .code { font-size: 13px; }
  .alt .t { font-size: 13px; flex: 1; min-width: 180px; }
  .alt .s { font-size: 11px; color: var(--muted); }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <button id="langBtn" class="lang">EN</button>

  <header>
    <h1 id="title">HS Code 검색</h1>
    <p class="sub" id="subtitle">제품 설명을 입력하면 국제 6자리 코드와 국가별 코드 길이를 보여줍니다.</p>
  </header>

  <div class="field">
    <label class="field-label" id="qLabel">제품 설명</label>
    <textarea id="q" placeholder="무선 블루투스 이어폰, 즉석 라면, 스테인리스 텀블러"></textarea>
  </div>

  <div class="field">
    <div class="chip-row" style="justify-content:space-between;margin-bottom:8px">
      <label class="field-label" id="countriesLabel" style="margin:0">국가 (<span id="cntCnt">0</span>)</label>
      <div class="chip-row" style="gap:12px">
        <button class="small-link" id="selAll">전체</button>
        <button class="small-link" id="selNone">초기화</button>
      </div>
    </div>
    <div class="chips" id="countries"></div>
  </div>

  <div class="field">
    <label class="field-label" id="examplesLabel">예시</label>
    <div class="chips" id="examples"></div>
  </div>

  <button class="submit" id="goBtn">검색</button>

  <div id="empty" class="empty">재질·용도·브랜드를 함께 적으면 결과가 더 정확해집니다.</div>
  <div id="result"></div>

  <footer>HS 2022 / WCO 6자리 기준. 본 도구는 보조용이며 실제 통관은 관세 당국 확인이 필요합니다.</footer>
</div>

let LOCALE = "ko";
let SELECTED = ["KR","US","CN","JP","EU"];

function t() { return I18N[LOCALE]; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

function tokenize(s) {
  const norm = s.toLowerCase().replace(/[\s\-_/().,]+/g," ").trim();
  const parts = norm.split(/\s+/).filter(Boolean);
  const grams = new Set(parts);
  for (const p of parts) {
    if (/[가-힣]/.test(p) && p.length >= 2) {
      for (let len = 2; len <= Math.min(p.length, 5); len++) {
        for (let i = 0; i + len <= p.length; i++) grams.add(p.slice(i, i + len));
      }
    }
  }
  return [...grams];
}

function score(entry, tokens) {
  const hay = [...entry.kw.map(x=>x.toLowerCase()), ...entry.kwKo, entry.title.toLowerCase(), entry.titleKo];
  let s = 0;
  for (const tk of tokens) {
    if (!tk) continue;
    for (const h of hay) {
      if (!h) continue;
      if (h === tk) s += 5;
      else if (h.includes(tk)) s += 2;
      else if (tk.length >= 3 && tk.includes(h)) s += 1;
    }
  }
  return s;
}

function pad(hs6, digits) { return digits <= 6 ? hs6.slice(0, digits) : hs6 + "0".repeat(digits - 6); }

function search(q) {
  const tokens = tokenize(q);
  const ranked = HS_DB.map(e => ({ e, s: score(e, tokens) })).filter(x => x.s > 0)
                      .sort((a,b) => b.s - a.s);
  if (!ranked.length) return null;
  const top = ranked[0].e;
  const conf = Math.min(0.85, 0.35 + ranked[0].s * 0.06);
  const alts = ranked.slice(1, 4).map(r => ({ hs6: r.e.hs6, title: LOCALE==="ko" ? r.e.titleKo : r.e.title, score: r.s }));
  const national = SELECTED.map(cc => {
    const meta = COUNTRIES.find(c => c.code === cc);
    return { country: cc, meta, code: pad(top.hs6, meta.digits) };
  });
  return { top, conf, alts, national };
}

function renderCountries() {
  const el = document.getElementById("countries");
  el.innerHTML = "";
  for (const c of COUNTRIES) {
    const div = document.createElement("div");
    div.className = "chip" + (SELECTED.includes(c.code) ? " active" : "");
    div.textContent = (LOCALE==="ko" ? c.nameKo : c.name) + " · " + t().digits(c.digits);
    div.onclick = () => {
      SELECTED = SELECTED.includes(c.code) ? SELECTED.filter(x=>x!==c.code) : [...SELECTED, c.code];
      renderCountries();
    };
    el.appendChild(div);
  }
  document.getElementById("cntCnt").textContent = SELECTED.length;
}

function renderExamples() {
  const el = document.getElementById("examples");
  el.innerHTML = "";
  for (const ex of t().ex) {
    const span = document.createElement("span");
    span.className = "ex";
    span.textContent = ex;
    span.onclick = () => { document.getElementById("q").value = ex; };
    el.appendChild(span);
  }
}

function renderText() {
  const T = t();
  document.getElementById("title").textContent = T.title;
  document.getElementById("subtitle").textContent = T.subtitle;
  document.getElementById("qLabel").textContent = T.qLabel;
  document.getElementById("q").placeholder = T.placeholder;
  document.getElementById("countriesLabel").innerHTML = `${T.countriesLabel} (<span id="cntCnt">${SELECTED.length}</span>)`;
  document.getElementById("examplesLabel").textContent = T.examplesLabel;
  document.getElementById("selAll").textContent = T.selAll;
  document.getElementById("selNone").textContent = T.selNone;
  document.getElementById("goBtn").textContent = T.go;
  document.getElementById("empty").textContent = T.empty;
  document.getElementById("langBtn").textContent = T.lang;
  document.title = T.title;
}

function renderResult(r) {
  const T = t();
  const el = document.getElementById("result");
  document.getElementById("empty").style.display = "none";

  if (!r) {
    el.innerHTML = `<div class="result-section"><p style="margin:0;color:var(--muted);font-size:14px">${T.nomatch}</p></div>`;
    return;
  }

  const conf = Math.round(r.conf * 100);
  const title = LOCALE === "ko" ? r.top.titleKo : r.top.title;
  const heading = r.top.hs6.slice(0,4);

  el.innerHTML = `
    <div class="result-section">
      <div class="hs-main">
        <span class="hs-code">${r.top.hs6}</span>
        <span class="hs-title">${escapeHtml(title)}</span>
      </div>
      <div class="meta-row">
        <div class="meta-item"><div class="k">${T.chapter}</div><div class="v">${r.top.chapter}</div></div>
        <div class="meta-item"><div class="k">${T.heading}</div><div class="v">${heading}</div></div>
        <div class="meta-item"><div class="k">${T.subheading}</div><div class="v">${r.top.hs6}</div></div>
        <div class="meta-item"><div class="k">${T.confidence}</div><div class="v">${conf}%</div><div class="conf-bar"><i style="width:${conf}%"></i></div></div>
      </div>
      <p class="rationale">${T.rationaleText}</p>
      <p class="warn">${T.warn}</p>
    </div>

    <div class="result-section">
      <h2>${T.national}</h2>
      <table>
        <thead><tr><th>${T.country}</th><th>${T.code}</th></tr></thead>
        <tbody>
          ${r.national.map(n => `
            <tr>
              <td><div class="country">${LOCALE==="ko" ? n.meta.nameKo : n.meta.name}</div><div class="schedule">${n.meta.schedule}</div></td>
              <td><span class="code">${n.code}</span></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>

    ${r.alts.length ? `
      <div class="result-section">
        <h2>${T.alternates}</h2>
        ${r.alts.map(a => `
          <div class="alt">
            <span class="code">${a.hs6}</span>
            <span class="t">${escapeHtml(a.title)}</span>
          </div>
        `).join("")}
      </div>
    ` : ""}
  `;
}

document.getElementById("goBtn").onclick = () => {
  const q = document.getElementById("q").value.trim();
  if (!q || SELECTED.length === 0) return;
  renderResult(search(q));
};
document.getElementById("q").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") document.getElementById("goBtn").click();
});
document.getElementById("selAll").onclick = () => { SELECTED = COUNTRIES.map(c=>c.code); renderCountries(); };
document.getElementById("selNone").onclick = () => { SELECTED = []; renderCountries(); };
document.getElementById("langBtn").onclick = () => {
  LOCALE = LOCALE === "ko" ? "en" : "ko";
  document.documentElement.lang = LOCALE;
  renderText(); renderCountries(); renderExamples();
};

renderText();
renderCountries();
renderExamples();
</script>
